<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindGraph</title>
<style>
  @import 'index.css';
</style>
<link rel="stylesheet" href="shared-sidebar.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { if (typeof mermaid !== 'undefined') mermaid.initialize({ startOnLoad: false, theme: 'dark', themeVariables: { primaryColor: '#2a2a2a', primaryTextColor: '#e8e6e0', lineColor: '#555', secondaryColor: '#1e1e1e' } }); });</script>
</head>
<body>

<!-- SIDEBAR (Mindmaps + Designs; shared with design.html, see js/library-sidebar.js) -->
<div id="sidebar-overlay"></div>
<div id="sidebar">
  <div id="sidebar-header">
    <h2>Bibliothek</h2>
    <button class="modal-close" id="sidebar-close-btn">×</button>
  </div>
  <div id="sidebar-tabs" data-default-tab="mindmaps">
    <button class="active" data-tab="mindmaps">Mindmaps</button>
    <button data-tab="designs">Designs</button>
  </div>
  <button id="sidebar-new-btn">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg>
    <span id="sidebar-new-label">Neue Mindmap</span>
  </button>
  <div id="sidebar-list"></div>
  <div id="sidebar-footer">Daten lokal gespeichert</div>
</div>

<div id="toolbar">
  <button class="tb-btn" id="btn-sidebar" title="Mindmaps">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="10" y2="12"/></svg>
  </button>
  <button class="tb-btn" id="btn-settings" title="Einstellungen (Ctrl+,)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3"/></svg>
  </button>
  <div class="logo">Second<span>Map</span></div>
  <a class="tb-btn" id="btn-design" href="design.html" title="Design-Editor öffnen (Figma-ähnlich)" style="text-decoration:none">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="8" height="8" rx="1.5"/><circle cx="10.5" cy="10.5" r="3.5"/></svg>
    Design
  </a>
  <span id="current-map-name"></span>
  <div class="tb-sep"></div>
  <button class="tb-btn disabled" id="btn-undo" title="Rückgängig (Ctrl+Z)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6l-3 3 3 3"/><path d="M1 9h9a4 4 0 0 1 0 8H8"/></svg>
  </button>
  <button class="tb-btn disabled" id="btn-redo" title="Wiederherstellen (Ctrl+Y)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 6l3 3-3 3"/><path d="M15 9H6a4 4 0 0 0 0 8h2"/></svg>
  </button>
  <div class="tb-sep"></div>
  <button class="tb-btn accent" id="btn-new-node" title="Neuen Block erstellen (N)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg>
    Neuer Block
  </button>
  <button class="tb-btn" id="btn-template" title="Template-Block erstellen">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/><line x1="5" y1="6" x2="11" y2="6"/><line x1="5" y1="10" x2="9" y2="10"/></svg>
    Template
  </button>
  <button class="tb-btn" id="btn-connect-mode" title="Verbindungsmodus (C)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="3" cy="8" r="2"/><circle cx="13" cy="8" r="2"/><line x1="5" y1="8" x2="11" y2="8" stroke-dasharray="2 2"/></svg>
    Verbinden
  </button>
  <button class="tb-btn" id="btn-group" title="Auswahl gruppieren (Ctrl+G)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"><rect x="1" y="1" width="14" height="14" rx="3"/></svg>
    Gruppe
  </button>
  <button class="tb-btn" id="btn-fit" title="Alle Blöcke anzeigen (F)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
    Übersicht
  </button>
  <button class="tb-btn" id="btn-search" title="Suche & Filter (Ctrl+F)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="6.5" r="4.5"/><line x1="10" y1="10" x2="14" y2="14"/></svg>
    Suche
  </button>
  <div class="tb-dropdown" id="export-dropdown">
    <button class="tb-btn" id="btn-export-menu" title="Exportieren">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2H6L2 6v8h12V6l-4-4z"/><line x1="8" y1="9" x2="8" y2="13"/><line x1="6" y1="11" x2="10" y2="11"/></svg>
      Export ▾
    </button>
    <div class="tb-dropdown-menu" id="export-menu">
      <button class="tb-dropdown-item" id="btn-export-json">JSON Export</button>
      <button class="tb-dropdown-item" id="btn-export-pdf">PDF Export</button>
      <button class="tb-dropdown-item" id="btn-export-md">Markdown Export</button>
    </div>
  </div>
  <button class="tb-btn" id="btn-import" title="JSON importieren">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2H6L2 6v8h12V6l-4-4z"/><line x1="8" y1="9" x2="8" y2="13"/><line x1="6" y1="11" x2="10" y2="11"/></svg>
    Import
  </button>
  <button class="tb-btn" id="btn-import-code" title="Code-Datei als Block importieren">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="5,4 1,8 5,12"/><polyline points="11,4 15,8 11,12"/><line x1="9" y1="2" x2="7" y2="14"/></svg>
    Code
  </button>
  <button class="tb-btn" id="btn-import-config" title="Config-Datei als Baum importieren">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3M3 3l2 2M11 11l2 2M3 13l2-2M11 5l2-2"/></svg>
    Config
  </button>
  <button class="tb-btn danger" id="btn-clear" title="Alles löschen">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3,4 13,4"/><path d="M5,4V2h6v2"/><path d="M5,4l1,10h4l1-10"/></svg>
    L
  </button>
  <div id="mode-indicator">normal</div>
</div>

<div id="canvas-wrap">
  <svg id="edges-layer">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" style="fill:var(--edge-color)"/>
      </marker>
      <marker id="arrow-hover" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" style="fill:var(--accent)"/>
      </marker>
      <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
        <path d="M8,0 L8,6 L0,3 z" style="fill:var(--edge-color)"/>
      </marker>
      <marker id="arrow-start-hover" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
        <path d="M8,0 L8,6 L0,3 z" style="fill:var(--accent)"/>
      </marker>
    </defs>
    <g id="edges-group"></g>
    <line id="temp-edge" style="stroke:var(--accent)" stroke-width="2" stroke-dasharray="6 4" display="none"/>
  </svg>
  <div id="groups-layer"></div>
  <div id="nodes-layer"></div>
  <div id="selection-rect"></div>
  <canvas id="minimap"></canvas>
  <div id="hints">
    <kbd>N</kbd> Neuer Block &nbsp; <kbd>C</kbd> Verbinden &nbsp; <kbd>F</kbd> Übersicht &nbsp;
    <kbd>Ctrl+Z</kbd> Undo &nbsp; <kbd>Ctrl+Y</kbd> Redo &nbsp;
    <kbd>Ctrl+C</kbd> Kopieren &nbsp; <kbd>Ctrl+V</kbd> Einfügen &nbsp;
    <kbd>Ctrl+A</kbd> Alle &nbsp; <kbd>Ctrl+G</kbd> Gruppieren &nbsp;
    <kbd>Shift+Drag</kbd> Auswahl &nbsp; <kbd>P</kbd> Pfad &nbsp; <kbd>Del</kbd> Löschen &nbsp;
    <kbd>Ctrl+F</kbd> Suche
  </div>
  <div id="search-panel">
    <div class="search-panel-header">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="width:14px;height:14px;flex-shrink:0"><circle cx="6.5" cy="6.5" r="4.5"/><line x1="10" y1="10" x2="14" y2="14"/></svg>
      <input id="search-input" placeholder="Suchen..." autocomplete="off"/>
      <button id="search-close" class="modal-close" style="width:22px;height:22px;font-size:14px">×</button>
    </div>
    <div class="search-filters">
      <select id="filter-color" class="search-filter-select" title="Nach Farbe filtern"><option value="">Alle Farben</option></select>
      <input id="filter-tag" class="search-filter-input" placeholder="Tag..." autocomplete="off"/>
      <label class="search-cb"><input type="checkbox" id="filter-fav"/> ★ Favoriten</label>
      <label class="search-cb"><input type="checkbox" id="filter-global"/> Alle Maps</label>
    </div>
    <div id="search-results"></div>
  </div>
</div>

<div id="breadcrumbs"></div>

<div id="toast"></div>
<input type="file" id="file-import" accept=".json" style="display:none">
<input type="file" id="file-import-code" accept=".c,.h,.rs,.py,.js,.ts,.java,.cpp,.hpp,.asm,.s,.sh,.bat,.ps1,.go,.zig,.v,.sv,.vhdl,.rb,.lua,.toml,.yaml,.yml,.xml,.txt,.md,.csv" style="display:none">
<input type="file" id="file-import-config" accept=".config,.conf,.cfg,.ini,.defconfig,.env,.toml,.yaml,.yml,.properties,.txt" style="display:none">
<input type="file" id="file-attach" multiple style="display:none">

<!-- Classic scripts sharing one global scope: the load order below matters (boot.js must be last). -->
<script src="js/constants.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/settings.js"></script>
<script src="js/performance.js"></script>
<script src="js/undo-redo.js"></script>
<script src="js/db.js"></script>
<script src="js/maps.js"></script>
<script src="js/folders.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/markdown.js"></script>
<script src="js/viewport.js"></script>
<script src="design/design-db.js"></script>
<script src="design/static.js"></script>
<script src="js/design-embed.js"></script>
<script src="js/nodes.js"></script>
<script src="js/node-preview.js"></script>
<script src="js/groups.js"></script>
<script src="js/hierarchy.js"></script>
<script src="js/edges.js"></script>
<script src="js/interactions.js"></script>
<script src="js/operations.js"></script>
<script src="js/clipboard.js"></script>
<script src="js/url-import.js"></script>
<script src="js/edit-modal.js"></script>
<script src="js/settings-ui.js"></script>
<script src="js/templates.js"></script>
<script src="js/import-export.js"></script>
<script src="js/file-import.js"></script>
<script src="js/path-highlight.js"></script>
<script src="js/attachments-favorites.js"></script>
<script src="js/search.js"></script>
<script src="js/document-export.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/buttons.js"></script>
<script src="js/library-sidebar.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
